services:
  aiwsp:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      PORT: 3000
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-wsp-admin}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_NAME_CN: ${COMPANY_NAME_CN:-}
      COMPANY_CODE: ${COMPANY_CODE:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-true}
    volumes:
      - aiwsp_data:/data
    depends_on:
      - clamav
  # Malware scanning for attachments (clamd). Needs about 2–3 GB of memory. Uploads are refused while it is unavailable.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - aiwsp
volumes:
  clamav_db:
  aiwsp_data:
  caddy_data:
  caddy_config:
